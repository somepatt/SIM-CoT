project: coconut
save_path: ./ckpts
name: traj_qwen3_0p6b_stage2_simcot

only_eval: False

# Core switches
coconut: True
cot: False
no_thoughts: False
no_cot: False

# Latent schedule (обычно оставляют тем же)
c_thought: 2
epochs_per_stage: 3
# One trajectory sample contains only the current thought.
max_latent_stage: 1
pad_latent_to_max: True
uniform_prob: 0.0

# Model: стартуем со Stage-1 чекпоинта
model_id: Qwen/Qwen3-0.6B
load_model_path: ./ckpts/traj_qwen3_0p6b_stage1_coconut/checkpoint_25
save_only_improve: False

# Train
wandb: False
seed: 0
resume: 25
bf16: True

train_path: resolved_trajectories_openai__Qwen__Qwen3-Coder-30B-A3B-Instruct.eval_default
val_path: resolved_trajectories_openai__Qwen__Qwen3-Coder-30B-A3B-Instruct.eval_default

# Drop samples where thought text is empty.
require_steps: True


max_seq_length: 4096
gradient_accumulation_steps: 4
reset_optimizer: True
batch_size_training: 2
debug: False
num_epochs: 10
lr: !!float "5e-5"
weight_decay: 0.01

# IMPORTANT: SIM-CoT mode (как в gsm_simcot.yaml)
mode: coconutgpt_same_word_embedding
explain_mode: v1_aug
training_method: full
